{% extends "base.html" %} 
{% block title %}Add Supply{% endblock %} 
{% block content %} 
<h1>Register New Supply</h1> 
<form method="POST"> 
    {% if error %}
    <p class="error-message">{{ error }}</p>{% endif %} 
    <label>Supply Code:</label> 
    <input type="text" name="supply_code" required> 
    <label>Supply Name:</label> 
    <input type="text" name="supply_name" required> 
    <label>Category:</label> 
    <select name="category_id" required> {% for category in categories %} <option value="{{ category.category_id }}">{{ category.category_name }}</option> {% endfor %} </select> 
    <label>Description:</label> 
    <textarea name="description"></textarea> 
    <label>Unit:</label> 
    <select name="unit_id" required> {% for unit in units %} <option value="{{ unit.unit_id }}">{{ unit.unit_name }}</option> {% endfor %} </select> 
    <label>Brand:</label> 
    <input type="text" name="brand"> 
    <label>Reorder Level:</label> 
    <input type="number" name="reorder_level" value="0" min="0"> 
    <label>Maximum Stock:</label> 
    <input type="number" name="maximum_stock" value="0" min="0"> 
    <label>Unit Cost:</label> 
    <input type="number" step="0.01" name="unit_cost" value="0" min="0"> <br><br> 
    <button type="submit" class="btn">Save Supply</button> 
</form> <br> 
<a href="/supplies">Back to Supplies List</a> 
{% endblock %}
