{% extends "base.html" %} 
{% block title %}Departments{% endblock %} 
{% block content %} 
<h1>Departments</h1> 
<a href="/departments/add" class="btn">Add New Department</a> 
<div class="card"> 
    <table> 
        <tr>
            <th>Name</th>
            <th>Status</th>
        </tr> 
        {% for dept in departments %} 
        <tr> 
            <td>{{ dept.department_name }}</td> 
            <td>{% if dept.status == 'Active' %}<span class="badge badge-active">Active</span>{% else %}<span class="badge badge-inactive">Inactive</span>{% endif %}</td> 
        </tr> 
        {% endfor %} 
    </table> 
</div> 
{% endblock %}
