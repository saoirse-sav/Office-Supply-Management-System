<!DOCTYPE html>
<html>
    <head>
        <title>Edit Supply</title>
    </head>
    <body>
        <h1>Edit Supply</h1>
        <form method="POST">
        {% if error %}
        <p style="color:red">{{error}}</p>
        {% endif %}
            <label>Supply Code</label>
            <br>
            <input type="text" name="supply_code" value="{{supply.supply_code}}" required><br><br> 
            <label>Supply Name:</label><br>
             <input type="text" name="supply_name" value="{{ supply.supply_name }}" required><br><br>
              <label>Category:</label><br> 
              <select name="category_id" required> 
            {% for category in categories %} 
            <option value="{{ category.category_id }}" {% if category.category_id == supply.category_id %}selected{% endif %}>{{ category.category_name }}</option> 
            {% endfor %} </select><br><br>
             <label>Description:</label><br>
              <textarea name="description">{{ supply.description }}</textarea><br><br>
               <label>Unit:</label><br> 
               <select name="unit_id" required> 
                {% for unit in units %}
                 <option value="{{ unit.unit_id }}" {% if unit.unit_id == supply.unit_id %}selected{% endif %}>{{ unit.unit_name }}</option> 
                 {% endfor %} 
                </select><br><br>
                 <label>Brand:</label><br>
                  <input type="text" name="brand" value="{{ supply.brand }}"><br><br> 
                  <label>Reorder Level:</label><br>
                   <input type="number" name="reorder_level" value="{{ supply.reorder_level }}"><br><br> 
                   <label>Maximum Stock:</label><br>
                    <input type="number" name="maximum_stock" value="{{ supply.maximum_stock }}"><br><br> 
                    <label>Unit Cost:</label><br> 
                    <input type="number" step="0.01" name="unit_cost" value="{{ supply.unit_cost }}"><br><br> 
                    <button type="submit">Update Supply</button> 
                </form> <br>
                 <a href="/supplies">Back to Supplies List</a> 
                </body>
                 </html>
        </form>
    </body>
</html>
