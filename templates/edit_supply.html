{% extends "base.html" %} 
{% block title %}Edit Supply{% endblock %} 
{% block content %} 
<h1>Edit Supply</h1> 
<form method="POST"> 
    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %} 
    <label>Supply Code:</label> 
    <input type="text" name="supply_code" value="{{ supply.supply_code }}" required> 
    <label>Supply Name:</label> 
    <input type="text" name="supply_name" value="{{ supply.supply_name }}" required> 
    <label>Category:</label> 
    <select name="category_id" required> {% for category in categories %} <option value="{{ category.category_id }}" {% if category.category_id == supply.category_id %}selected{% endif %}>{{ category.category_name }}</option> {% endfor %} </select> 
    <label>Description:</label> 
    <textarea name="description">{{ supply.description }}</textarea> 
    <label>Unit:</label> 
    <select name="unit_id" required> {% for unit in units %} <option value="{{ unit.unit_id }}" {% if unit.unit_id == supply.unit_id %}selected{% endif %}>{{ unit.unit_name }}</option> {% endfor %} </select> 
    <label>Brand:</label> 
    <input type="text" name="brand" value="{{ supply.brand }}"> 
    <label>Reorder Level:</label> 
    <input type="number" name="reorder_level" value="{{ supply.reorder_level }}" min="0"> 
    <label>Maximum Stock:</label> 
    <input type="number" name="maximum_stock" value="{{ supply.maximum_stock }}" min="0"> 
    <label>Unit Cost:</label> 
    <input type="number" step="0.01" name="unit_cost" value="{{ supply.unit_cost }}" min="0"> <br><br> 
    <button type="submit" class="btn">Update Supply</button> 
</form> <br> 
<a href="/supplies">Back to Supplies List</a> 
{% endblock %}
